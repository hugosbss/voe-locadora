<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Entrar | VCA</title>
    <link rel="icon" type="image/jpeg" href="assets/img/vca-logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-wrap">
        <div class="auth-col">
            <div class="auth-brand">
                <span class="auth-brand-logo">
                    <img src="assets/img/vca-logo.jpeg" alt="VCA Locadora">
                </span>
                <span class="auth-brand-name">VCA</span>
            </div>

            <div class="card p-5" style="padding: 1.5rem;">
                <h1 class="auth-title">Acesso restrito</h1>
                <p class="auth-sub mt-2 mb-6">Faça login para acessar o painel.</p>

                <form class="auth-form" action="#" method="post">
                    <div class="form-field">
                        <label for="login-email" class="form-label">E-mail</label>
                        <input id="login-email" name="email" type="email" class="form-input" placeholder="voce@email.com" autocomplete="username">
                    </div>

                    <div class="form-field">
                        <label for="login-password" class="form-label">Senha</label>
                        <div style="position: relative;">
                            <input id="login-password" name="password" type="password" class="form-input" style="padding-right: 2.75rem;" autocomplete="current-password">
                            <button
                                type="button"
                                data-password-toggle="login-password"
                                aria-pressed="false"
                                aria-label="Mostrar senha"
                                style="position: absolute; inset: 0 0 0 auto; width: 2.75rem; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #71717a; cursor: pointer;">
                                <svg data-icon-eye class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                <svg data-icon-eye-off class="is-hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                    </div>

                    <label class="row text-sm text-dim" style="gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" style="width: 1rem; height: 1rem; accent-color: #fed106;">
                        Manter conectado
                    </label>

                    <button type="submit" class="btn btn-primary btn-block">Entrar</button>

                    <p class="auth-extra">
                        <a href="admin-login.html">Esqueci minha senha</a>
                    </p>
                </form>
            </div>

            <p class="demo-note">
                Protótipo &mdash; no sistema real o login em duas etapas (2FA) é exigido
                quando habilitado e os campos são validados no servidor.
            </p>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
