<!DOCTYPE html>

    <link rel="stylesheet" href="assets/css/style.css">

<body class="app-body font-sans text-slate-800 antialiased">
    <div class="min-h-screen flex flex-col">
        <header class="app-header">

                            </svg>
                        </span>
                        <div class="brand-text">
                            <p class="brand-title">Locadora</p>
                            <p class="brand-sub">Cadastro de Clientes</p>
                        </div>
                    </div>
                    <span class="chip">
                        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" stroke-linecap="round" stroke-linejoin="round"/></svg>

            </div>
        </header>

        <main class="container">
            <div class="card p-6 sm:p-10 center-box" style="padding: 1.5rem;">
                <div class="check-circle">
                    <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <h1 class="page-title" style="font-size: 1.5rem;">Cadastro enviado com sucesso</h1>
                <p class="page-sub" style="margin-top: 0.5rem; font-size: 1rem; line-height: 1.625; color: var(--slate-600);">
                    Seus dados serão analisados pela nossa equipe.
                </p>

                <p class="mt-6 text-slate-400" style="font-size: 0.875rem;">
                    Você receberá o retorno pelos canais informados no cadastro.
                </p>

                <a href="form.html" class="btn btn-ghost mt-8">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 17l-5-5m0 0 5-5m-5 5h12" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Voltar ao início
                </a>
            </div>
        </main>

        <footer class="public-footer">
            &copy; 2026 Locadora &middot; Dados protegidos e utilizados somente para análise da locação.
        </footer>
    </div>
